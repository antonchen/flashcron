name: Release

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-binaries:
    name: Build ${{ matrix.variant }} for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [core, web, dep-manager]
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu]
        include:
          - target: x86_64-unknown-linux-gnu
            name: flashcron-linux-x86_64

          - target: x86_64-unknown-linux-musl
            name: flashcron-linux-x86_64-musl

          - target: aarch64-unknown-linux-gnu
            name: flashcron-linux-aarch64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: contains(matrix.target, 'aarch64') || contains(matrix.target, 'musl')
        run: cargo install cross

      - name: Build binary
        run: |
          case "${{ matrix.variant }}" in
            core) features="--no-default-features" ;;
            web) features="--no-default-features --features web" ;;
            dep-manager) features="--no-default-features --features web,dep-manager" ;;
          esac
          if [ "${{ contains(matrix.target, 'aarch64') || contains(matrix.target, 'musl') }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} $features
          else
            cargo build --release --target ${{ matrix.target }} $features
          fi
        shell: bash

      - name: Prepare asset
        run: |
          mkdir -p staging
          asset_name="${{ matrix.name }}"
          if [ "${{ matrix.variant }}" != "core" ]; then
            asset_name="${asset_name}-${{ matrix.variant }}"
          fi
          cp target/${{ matrix.target }}/release/flashcron staging/
          cp LICENSE staging/
          cp README.md staging/
          cd staging && tar czf ../${asset_name}.tar.gz *
          echo "asset_name=$asset_name" >> "$GITHUB_ENV"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.asset_name }}
          path: ${{ env.asset_name }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            flashcron-*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: Build Docker Image
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Get version from tag
        id: get_version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Prepare binaries for Docker
        run: |
          for feature in web dep-manager; do
            mkdir -p "binaries/$feature/amd64" "binaries/$feature/arm64"
            tar -xzf "flashcron-linux-x86_64-$feature.tar.gz" -C "binaries/$feature/amd64/"
            tar -xzf "flashcron-linux-aarch64-$feature.tar.gz" -C "binaries/$feature/arm64/"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          build-args: FEATURE=web
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:web-${{ steps.get_version.outputs.version }}
            ghcr.io/${{ github.repository }}:web-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flashcron:web-${{ steps.get_version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/flashcron:web-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Dependency Management image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          build-args: FEATURE=dep-manager
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flashcron:${{ steps.get_version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/flashcron:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
