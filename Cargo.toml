[package]
name = "flashcron"
version = "1.0.0"
edition = "2021"
rust-version = "1.89.0"
authors = ["Alfredo Baratta <alfredobaratta@outlook.com>", "Anton Chen <contact@antonchen.com>"]
description = "A lightning-fast, ultra-efficient cron daemon written in Rust - Schedule tasks at the speed of light"
license = "MIT"
repository = "https://github.com/antonchen/flashcron"
homepage = "https://github.com/antonchen/flashcron"
documentation = "https://docs.rs/flashcron"
keywords = ["cron", "scheduler", "daemon", "async", "performance"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
# Async runtime - lightweight
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "signal", "process", "fs", "macros", "io-util", "net"] }

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }

# Configuration
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

# Logging
log = { version = "0.4.35", features = ["kv", "serde", "kv_unstable"] }
fern = "0.7.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

# Cron parsing
cron = "0.17.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Database
rusqlite = { version = "0.42.0", features = ["bundled", "fallible_uint"] }
tokio-rusqlite = "0.9.0"

# Process management
nix = { version = "0.31.3", features = ["signal", "process", "user"] }

# Notify for config reload
notify = "8.2.2"

# UUID for job IDs
uuid = { version = "1.29.2", features = ["v4", "serde"] }
axum = { version = "0.8.9", optional = true }
tower-http = { version = "0.7.1", features = ["cors", "trace"], optional = true }
reqwest = { version = "0.13.5", features = ["json"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
toml_edit = { version = "0.25.17", optional = true }
regex = "1.13.1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
tempfile = "3.27.0"
tokio-test = "0.4.6"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[features]
default = ["web"]
web = ["dep:axum", "dep:tower-http", "dep:reqwest", "dep:tokio-stream", "dep:toml_edit"]
dep-manager = ["web"]

[[bin]]
name = "flashcron"
path = "src/main.rs"

[[bench]]
name = "scheduler_bench"
harness = false

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "database_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1

[build-dependencies]
html-minifier = "6.0.1"
