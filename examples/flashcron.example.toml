# FlashCron Example Configuration
# Copy this file to flashcron.toml and customize for your needs
# Job definitions are supported by the core profile; Web jobs are managed in the Dashboard.
# The file shows settings and example jobs. Web builds ignore [jobs.*] with a warning and
# load job definitions from SQLite. Remove fields marked Web when building core.

#==============================================================================
# Global Settings
#==============================================================================
[settings]
# Log level: trace, debug, info, warn, error
log_level = "info"

# Output logs in JSON format (useful for log aggregators)
json_logs = false

# Maximum Starting/Running jobs (0 = unlimited); changes apply on config reload.
max_concurrent_jobs = 10

# Optional executable script called once after a job's final failure; JSON is sent on stdin.
# failure_hook = "/usr/local/bin/flashcron-failure-hook"

# Web only: Dashboard/API bind address.
api_host = "0.0.0.0"

# Web only: Dashboard/API port.
api_port = 8080

# Web only: token required by protected API operations. If omitted, a random token is generated and persisted.
# api_token = "your-secret-token-here"

# SQLite database file path for persistence (history, statistics)
sql_file = "flashcron.db"

# Web only: directory for scripts managed in the Dashboard.
script_dir = "scripts"

# Web only: maximum history entries retained per job, enforced on each write.
job_history_size = 100

# Web only: maximum history entries retained globally, enforced on each write. 0 disables execution history.
max_history_size = 10000

# Optional default working directory for all jobs.
# Jobs can still override this individually.
# working_dir = "/var/lib/flashcron"

# Default shell for executing commands
# Common choices: "/bin/sh", "/bin/bash"
shell = "/bin/sh"

# Timezone for scheduling. Priority: TZ env > this setting > system > UTC
# Formats: "System", "UTC", "Asia/Shanghai", "America/New_York", etc.
timezone = "System"

# Maximum seconds to wait for running jobs during graceful shutdown
shutdown_timeout = 30

# Whether to print job execution output to the main daemon logs
# Can be overridden per job
print_output = false

#==============================================================================
# Job Definitions
#==============================================================================

# Simple example: Echo every minute
[jobs.heartbeat]
schedule = "* * * * *"
command = "echo 'FlashCron is alive!'"
description = "Simple heartbeat job"
enabled = true
print_output = true         # Enable output printing for this job specifically

# Daily backup at 2 AM
[jobs.daily_backup]
schedule = "0 2 * * *"
command = "/usr/local/bin/backup.sh --full"
description = "Full daily backup"
enabled = true
timeout = 7200              # 2 hour timeout
retry_count = 3             # Retry up to 3 times on failure
retry_delay = 300           # Wait 5 minutes between retries
working_dir = "/var/backups"
environment = { BACKUP_TYPE = "full", NOTIFY_EMAIL = "admin@example.com" }
# user = "backup" # root 运行 FlashCron 时指定任务用户；留空默认 nobody，非 root 运行时忽略

# Cleanup old files every 6 hours
[jobs.cleanup_temp]
schedule = "0 */6 * * *"
command = "find /tmp -type f -mtime +7 -delete"
description = "Remove temp files older than 7 days"
enabled = true
timeout = 300

# Database maintenance - weekly on Sunday at 3 AM
[jobs.db_maintenance]
schedule = "0 3 * * 7"
command = "/opt/scripts/db-vacuum.sh"
description = "Weekly database maintenance"
enabled = true
timeout = 3600
# Tags are descriptive metadata; currently they do not filter or change scheduling.
tags = ["database", "maintenance"]

# SSL certificate renewal check - daily at noon
[jobs.ssl_check]
schedule = "0 12 * * *"
command = "certbot renew --quiet"
description = "Check and renew SSL certificates"
enabled = true
run_on_startup = true       # Also run when daemon starts

# Custom shell example - using bash specifically
[jobs.complex_script]
schedule = "30 4 * * *"
command = "source ~/.bashrc && run_analysis.sh"
description = "Complex analysis with bash features"
enabled = true
shell = "/bin/bash"
working_dir = "/opt/analysis"

# Health check every 5 minutes
[jobs.health_check]
schedule = "*/5 * * * *"
command = "curl -sf http://localhost:8080/health || exit 1"
description = "Application health check"
enabled = true
timeout = 30
max_output_size = 4096

# Report generation - weekdays at 8 AM
[jobs.daily_report]
schedule = "0 8 * * 1-5"
command = "/opt/scripts/generate-report.py --format pdf --send-email"
description = "Generate and send daily report"
enabled = true
timeout = 600
environment = { PYTHONPATH = "/opt/scripts", SMTP_HOST = "mail.example.com" }
# Tags are descriptive metadata; currently they do not filter or change scheduling.
tags = ["reporting", "email"]

# Disabled job example: retained in config but never scheduled while enabled is false.
[jobs.deprecated_task]
schedule = "0 0 * * *"
command = "echo 'This job is disabled'"
description = "Old task - kept for reference"
enabled = false
